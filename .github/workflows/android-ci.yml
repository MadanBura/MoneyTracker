name: Android-CI

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Set Up JDK
        uses: actions/setup-java@v1
        with:
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: ${{ runner.os }}-${{ steps.get-date.outputs.date }}-${{ hashFiles('**/lockfiles') }}

      - name: Grant Permission
        run: chmod +x gradlew


      - name: Run tests
        run: ./gradlew test

      - name: Build APK
        run: ./gradlew assembleDebug