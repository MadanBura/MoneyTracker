name: Android CD

on:
  push:
    branches: ["develop"]

  pull_request:
    branches: ["develop"]


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Set Up JDK
        uses: actions/setup-java@v1
        with:
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: ${{ runner.os }}-${{ steps.get-date.outputs.date }}-${{ hashFiles('**/lockfiles') }}

      - name: Grant Permission
        run: chmod +x gradlew

      - name: Create Firebase JSON
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > firebase-key.json

      - name: Set Firebase Credentials
        run: |
          echo "GOOGLE_APPLICATION_CREDENTIALS=$PWD/firebase-key.json" >> $GITHUB_ENV

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Upload APK to Firebase
        run: ./gradlew appDistributionUploadDebug